<div class="page-container">
    <div class="header-actions">
        <h2>User Management</h2>
        <button class="btn btn-primary" (click)="openModal()">
            <i class="fas fa-user-plus"></i> Add User
        </button>
    </div>

    <div class="card">
        <table class="table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Zone</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of users">
                    <td>{{ user.fullName }}</td>
                    <td>{{ user.email }}</td>
                    <td><span class="badge role">{{ user.role }}</span></td>
                    <td>{{ user.zone || '-' }}</td>
                    <td><span class="badge status active">{{ user.status || 'Active' }}</span></td>
                    <td>
                        <button class="btn-icon" *ngIf="user.role === 'Collector' && user.status !== 'Active'" (click)="approveCollector(user.id)" title="Approve Collector">
                            <i class="fas fa-check"></i>
                        </button>
                        <button class="btn-icon delete" (click)="deleteUser(user.id)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" *ngIf="showModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add New User</h3>
            <button class="close-btn" (click)="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form [formGroup]="userForm" (ngSubmit)="submitUser()">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" formControlName="fullName">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" formControlName="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" formControlName="password">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select formControlName="role">
                        <option value="Admin">Admin</option>
                        <option value="MunicipalityOfficer">Municipality Officer</option>
                        <option value="Collector">Collector</option>
                        <option value="Citizen">Citizen</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Zone (Optional)</label>
                    <input type="text" formControlName="zone">
                </div>
                <button type="submit" class="btn btn-primary">Create User</button>
            </form>
        </div>
    </div>
</div>
