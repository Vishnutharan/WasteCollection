<div class="login-container">
  <div class="login-card">
    <div class="header">
      <i class="fas fa-recycle logo-icon"></i>
      <h1>CleanLanka</h1>
      <p>Waste Management System</p>
    </div>

    <div *ngIf="success" class="success-message">
      <i class="fas fa-check-circle"></i> {{ success }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" formControlName="email" placeholder="Enter your email" [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        </div>
        <div class="field-error" *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">Email is required</div>
        <div class="field-error" *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched">Enter a valid email</div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" formControlName="password" placeholder="Enter your password" [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        </div>
        <div class="field-error" *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">Password is required</div>
      </div>

      <div *ngIf="error" class="error-message">
        <i class="fas fa-exclamation-circle"></i> {{ error }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading" class="btn-login">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading"><i class="fas fa-spinner fa-spin"></i> Logging in...</span>
      </button>
    </form>

    <div class="auth-switch">
      <span>New user?</span>
      <a routerLink="/register">Create an account</a>
    </div>

    <div class="demo-logins">
      <p>Demo Accounts:</p>
      <div class="tags">
        <span (click)="demoLogin('Admin')" class="tag admin">Admin</span>
        <span (click)="demoLogin('Citizen')" class="tag citizen">Citizen</span>
        <span (click)="demoLogin('Collector')" class="tag collector">Collector</span>
      </div>
    </div>
  </div>
</div>
